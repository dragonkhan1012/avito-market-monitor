<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Avito Market Monitor</title>
  <desc id="desc">Мониторинг объявлений, история цен, Excel и Telegram. Иллюстрация графика наблюдений.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1525"/><stop offset="1" stop-color="#183347"/></linearGradient><linearGradient id="line"><stop stop-color="#4fe0bd"/><stop offset="1" stop-color="#70b9ff"/></linearGradient></defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
